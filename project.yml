name: SkatTrainer
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk.git
    exactVersion: 18.1.1
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
  developmentLanguage: de
  developmentRegion: de
  knownRegions:
    - Base
    - de
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  SkatTrainer:
    type: application
    platform: iOS
    sources:
      - path: SkatTrainer
      - path: Shared
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.skat
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-A AppIcon-B AppIcon-C"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        PRODUCT_NAME: "Skat Trainer"
        PRODUCT_MODULE_NAME: SkatTrainer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: "39"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SkatTrainer/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # Meta ad measurement (Shared/Services/MetaAds.swift). Empty = off: no
        # Meta SDK start, no ATT prompt. Fill both from the Meta app's
        # Settings > Basic and Advanced pages, in the same build that updates
        # the App Store privacy labels, and add this app to the trial relay.
        # See .claude/rules/meta-ads.md.
        META_APP_ID: ""
        META_CLIENT_TOKEN: ""
    dependencies:
      - package: RevenueCat
      - package: Facebook
        product: FacebookCore
      - sdk: AdSupport.framework
      - sdk: AppTrackingTransparency.framework

  SkatTrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkatTrainerTests
    dependencies:
      - target: SkatTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skat Trainer.app/Skat Trainer"

  # App Store screenshot capture. Deliberately NOT in the SkatTrainer scheme's
  # test action: it drives the real UI and takes a minute, and the unit-test
  # loop should stay instant. Drive it with scripts/capture-screenshots.sh.
  SkatTrainerScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SkatTrainerScreenshots
    dependencies:
      - target: SkatTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SkatTrainer

  # The paywall purchase probe. Its own target rather than a file dropped into
  # SkatTrainerScreenshots: that one runs under a test plan that activates
  # StoreKit Testing, and this has to reach RevenueCat's Test Store instead.
  SkatTrainerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SkatTrainerUITests
    dependencies:
      - target: SkatTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.skat.uitests
        TEST_TARGET_NAME: SkatTrainer

schemes:
  SkatTrainerUITests:
    build:
      targets:
        SkatTrainer: all
        SkatTrainerUITests: [test]
    test:
      config: Debug
      targets:
        - SkatTrainerUITests
    run:
      config: Debug

  SkatTrainer:
    build:
      targets:
        SkatTrainer: all
    run:
      config: Debug
      storeKitConfiguration: SkatTrainer/SkatTrainer.storekit
    test:
      config: Debug
      targets:
        - SkatTrainerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Screenshots:
    build:
      targets:
        SkatTrainer: all
        SkatTrainerScreenshots: [test]
    test:
      config: Debug
      targets:
        - SkatTrainerScreenshots
