name: SkatTrainer
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.72.0
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  lastUpgradeCheck: "1600"
  developmentLanguage: de
  developmentRegion: de
  knownRegions:
    - Base
    - de
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  SkatTrainer:
    type: application
    platform: iOS
    sources:
      - path: SkatTrainer
      - path: Shared
    settings:
      base:
        DEVELOPMENT_TEAM: YXG4MP6W39
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.skat
        PRODUCT_NAME: "Skat Trainer"
        PRODUCT_MODULE_NAME: SkatTrainer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "25"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SkatTrainer/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: RevenueCat

  SkatTrainerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkatTrainerTests
    dependencies:
      - target: SkatTrainer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skat Trainer.app/Skat Trainer"

schemes:
  SkatTrainer:
    build:
      targets:
        SkatTrainer: all
    run:
      config: Debug
      storeKitConfiguration: SkatTrainer/SkatTrainer.storekit
    test:
      config: Debug
      targets:
        - SkatTrainerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
